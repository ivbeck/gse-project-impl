[project]
name = "blokus-engine"
version = "0.1.0"
description = "Configurable Blokus game engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.47.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.ruff]
src = ["src"]
extend-exclude = ["build"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[project.scripts]
blokus-engine = "app:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
